# Fly.io configuration.
#   fly launch --no-deploy --copy-config
#   fly deploy --build-arg NEXT_PUBLIC_SITE_URL=https://your-app.fly.dev
#
# Replace "protostack" with your app name and the URL in [build.args].

app = "protostack"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_SITE_URL = "https://protostack.fly.dev"

[env]
  PORT = "3000"
  HTTP_TEST_ALLOWED_HOSTS = "example.com,www.example.com,httpbin.org,jsonplaceholder.typicode.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
