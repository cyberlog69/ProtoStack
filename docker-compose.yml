# Docker Compose / Podman Compose.
#   docker compose up -d --build
#   podman-compose up -d --build
#
# NEXT_PUBLIC_SITE_URL is a *build* argument: change it and rebuild, otherwise
# canonical URLs and the sitemap keep pointing at the old origin.

services:
  protostack:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: protostack:local
    container_name: protostack
    restart: unless-stopped
    ports:
      - "${PROTOSTACK_PORT:-3000}:3000"
    environment:
      HTTP_TEST_ALLOWED_HOSTS: ${HTTP_TEST_ALLOWED_HOSTS:-example.com,www.example.com,httpbin.org,jsonplaceholder.typicode.com}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
