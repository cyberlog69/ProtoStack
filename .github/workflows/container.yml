name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cyberlog69/protostack

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://protostack.online' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to Oracle VM
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy update via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_VM_KEY }}
          script: |
            set -eu

            podman pull ghcr.io/cyberlog69/protostack:latest

            if systemctl --user is-active protostack >/dev/null 2>&1; then
              systemctl --user restart protostack
            elif podman ps -a -q --filter "name=protostack" | grep -q .; then
              podman stop protostack || true
              podman rm protostack || true
              podman run -d --name protostack --restart always -p 8080:3000 \
                -e HTTP_TEST_ALLOWED_HOSTS=example.com,www.example.com,httpbin.org,jsonplaceholder.typicode.com \
                ghcr.io/cyberlog69/protostack:latest
            else
              echo "No protostack service or container found on the VM." >&2
              exit 1
            fi

            healthy=0
            attempt=1
            while [ "$attempt" -le 30 ]; do
              if command -v curl >/dev/null 2>&1; then
                if curl -fsS --max-time 3 http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
                  healthy=1
                  break
                fi
              elif podman exec protostack node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                healthy=1
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Deployment health check failed; recent container logs:" >&2
              podman logs --tail 60 protostack >&2 || true
              exit 1
            fi

            echo "ProtoStack is healthy on Oracle VM."
            podman image inspect ghcr.io/cyberlog69/protostack:latest \
              --format 'Running image digest: {{.Digest}}' 2>/dev/null || true
