name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cyberlog69/protostack

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://protostack.online' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to Oracle VM
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy update via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_VM_KEY }}
          script: |
            podman pull ghcr.io/cyberlog69/protostack:latest
            if systemctl --user is-active protostack >/dev/null 2>&1; then
              systemctl --user restart protostack
            elif podman ps -q --filter "name=protostack" | grep -q .; then
              podman stop protostack
              podman rm protostack
              podman run -d --name protostack --restart always -p 8080:3000 \
                -e HTTP_TEST_ALLOWED_HOSTS=example.com,www.example.com,httpbin.org,jsonplaceholder.typicode.com \
                ghcr.io/cyberlog69/protostack:latest
            else
              systemctl --user restart protostack || true
            fi
            echo "ProtoStack updated successfully on Oracle VM."
